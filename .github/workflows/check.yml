name: Rust checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy
          rustup override set 1.95.0
      - name: Format
        run: cargo fmt --all -- --check
      - name: Native model tools
        run: |
          $clangDirectory = Join-Path $env:ProgramFiles 'LLVM/bin'
          if (-not (Test-Path (Join-Path $clangDirectory 'libclang.dll'))) {
            throw 'The Windows runner must provide LLVM with libclang.dll.'
          }
          $env:LIBCLANG_PATH = $clangDirectory
          "LIBCLANG_PATH=$env:LIBCLANG_PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: Build desktop
        run: cargo build -p ledgers-bro --release --locked
